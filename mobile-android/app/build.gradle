plugins {
    id 'com.android.application'
}

// The standalone phone album is built by Vite and copied into APK assets.
// Pass -PwebDistDir=<path> when building from an ASCII mirror outside the repo.
def webDistPath = findProperty('webDistDir')
def webDist = webDistPath ? file(webDistPath) : file('../../dist')

tasks.register('syncWebAssets', Sync) {
    doFirst {
        if (!webDist.exists()) {
            throw new GradleException("Web build not found at ${webDist}. Run npm run build first or pass -PwebDistDir=<dist>.")
        }
    }
    from(webDist)
    into(layout.projectDirectory.dir('src/main/assets/web'))
}

tasks.named('preBuild').configure {
    dependsOn 'syncWebAssets'
}

android {
    namespace 'com.hoshikuzu.mobile'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hoshikuzu.mobile'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // The public test build is signed with the local debug key so it can
            // be sideloaded without shipping a private keystore in the repo.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.5.0'
}

configurations.configureEach {
    resolutionStrategy {
        // zxing-android-embedded still pulls old Kotlin jdk7/jdk8 shims that
        // duplicate classes already present in the modern stdlib.
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

tasks.withType(Test).configureEach {
    // Optional offline Robolectric mode for machines behind a proxy. Pass
    // -Drobolectric.offline=true -Drobolectric.dependency.dir=<dir>.
    ['robolectric.offline', 'robolectric.dependency.dir'].each { key ->
        if (System.getProperty(key) != null) {
            systemProperty key, System.getProperty(key)
        }
    }
}
